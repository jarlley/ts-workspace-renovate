name: Trivy Security Scan + Renovate

on:
  workflow_dispatch:
  push:
    branches: [development, test/trivy-renovate]
    paths:
      - '.github/workflows/trivy-scan.yml'
  pull_request:
    branches: [development, test/trivy-renovate]

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    outputs:
      vulnerabilities_found: ${{ steps.check.outputs.vulnerabilities_found }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy
        run: trivy fs . --severity CRITICAL,HIGH --format table --output trivy-report.txt

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Check vulnerabilities
        id: check
        run: |
          if grep -q "HIGH\|CRITICAL" trivy-report.txt; then
            echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT
          else
            echo "vulnerabilities_found=false" >> $GITHUB_OUTPUT
          fi

  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: needs.trivy-scan.outputs.vulnerabilities_found == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.14
        with:
          configurationFile: renovate.json
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
